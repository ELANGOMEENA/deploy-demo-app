apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-python-app
  namespace: default
  labels:
    app: demo-python-app
spec:
  replicas: 5
  selector:
    matchLabels:
      app: demo-python-app
  template:
    metadata:
      labels:
        app: demo-python-app
    spec:
      containers:
      - name: demo-python-app
        image:  satishkarengula/demo-python-app:v1
        ports:
        - containerPort: 5000
